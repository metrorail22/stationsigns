<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>DL&W Station – Next 3 Departures</title>
<style>
:root{
--bg:#0b0f14; --panel:#101826; --panel2:#0e1522; --text:#eaf2ff; --muted:#a9b7d0;
--line:rgba(255,255,255,.12); --accent:#7dd3fc; --good:#86efac; --bad:#fca5a5;
--time:#03c6fc;
--uiScale: 1.0;
--signageScale: 1.55; /* tuned for 43" 16:9 @ 1080p */
}
*{box-sizing:border-box;}
html,body{height:100%}
body{
margin:0;
background:linear-gradient(180deg,var(--bg),#070a10);
color:var(--text);
font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
overflow:hidden;
}
.wrap{
height:100%;
display:flex;
flex-direction:column;
padding:clamp(12px,2.0vh,22px) clamp(14px,2.2vw,26px);
gap:clamp(10px,1.6vh,16px);
}
/* === Signage mode (OptiSigns auto-detect or ?signage=1) === */
html.signage .wrap{
transform: scale(var(--signageScale));
transform-origin: top left;
width: calc(100% / var(--signageScale));
height: calc(100% / var(--signageScale));
}
html.signage .dbg, html.signage #dbgBtn{display:none !important;}
.top{
display:flex;
align-items:flex-end;
justify-content:space-between;
gap:clamp(12px,2vw,16px);
padding:clamp(14px,2.2vh,18px) clamp(14px,2.0vw,20px);
background:linear-gradient(180deg,var(--panel),var(--panel2));
border:1px solid var(--line);
border-radius:clamp(14px,2.2vh,18px);
box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.title{display:flex;flex-direction:column;gap:clamp(4px,0.7vh,6px);}
.title-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
.title h1{margin:0;font-size:clamp(26px,3.2vw,42px);letter-spacing:.2px;}
.subtitle{color:var(--muted);font-size:clamp(12px,1.2vw,16px);display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.badge{
font-size:clamp(10px,0.95vw,12px);
color:#0b1220;
background:rgba(125,211,252,.95);
padding:4px 10px;
border-radius:999px;
font-weight:800;
letter-spacing:.04em;
white-space:nowrap;
}
.badge.weekend{background:rgba(252,165,165,.95);}
.clock{text-align:right;display:flex;flex-direction:column;gap:clamp(4px,0.7vh,6px);min-width:clamp(180px,22vw,260px);}
.clock .time{font-size:clamp(30px,3.6vw,50px);font-weight:700;letter-spacing:.5px;}
.clock .date{color:var(--muted);font-size:clamp(12px,1.2vw,16px);}
.grid{
display:grid;
grid-template-columns:1fr;
gap:clamp(10px,1.6vh,16px);
flex:1;
min-height:0;
}
.card{
background:linear-gradient(180deg,var(--panel),var(--panel2));
border:1px solid var(--line);
border-radius:clamp(14px,2.2vh,18px);
padding:clamp(12px,1.8vh,16px) clamp(12px,1.8vw,18px);
display:flex;
flex-direction:column;
min-height:0;
box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.card h2{
margin:0 0 clamp(8px,1.2vh,10px) 0;
font-size:clamp(16px,1.8vw,22px);
letter-spacing:.2px;
display:flex;
align-items:center;
justify-content:space-between;
gap:clamp(8px,1.2vw,10px);
}
.pill{
font-size:clamp(11px,1.0vw,14px);
color:#0b1220;
background:var(--accent);
padding:clamp(5px,0.8vh,6px) clamp(8px,1.2vw,10px);
border-radius:999px;
font-weight:700;
letter-spacing:.2px;
white-space:nowrap;
}
table{width:100%;border-collapse:collapse;font-size:clamp(14px,1.3vw,18px);}
col.c-time{width:46%;}
col.c-dir{width:24%;}
col.c-in{width:30%;}
th,td{padding:clamp(8px,1.2vh,12px) clamp(4px,0.6vw,6px);border-bottom:1px solid var(--line);}
th{color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(10px,0.95vw,12px);}
td.time{font-size:clamp(22px,2.3vw,34px);font-weight:800;letter-spacing:.4px;color:var(--time);}
td.dir{color:var(--text);font-weight:650;font-size:clamp(14px,1.4vw,20px);}
td.in{color:var(--good);font-weight:700;text-align:right;white-space:nowrap;font-size:clamp(14px,1.4vw,20px);}
tr:last-child td{border-bottom:0}
.footer{
display:flex;
justify-content:space-between;
align-items:center;
color:var(--muted);
font-size:clamp(10px,0.95vw,12px);
padding:0 clamp(4px,0.6vw,6px);
gap:10px;
flex-wrap:wrap;
}
.status-ok{color:var(--good);font-weight:700;}
.status-bad{color:var(--bad);font-weight:700;}
.small{font-size:clamp(10px,0.9vw,11px);opacity:.95}
/* Debug toggle + banner */
.dbg-btn{
border:1px solid var(--line);
background:rgba(255,255,255,.06);
color:var(--text);
padding:6px 10px;
border-radius:10px;
font-weight:700;
cursor:pointer;
user-select:none;
font-size:12px;
-webkit-tap-highlight-color: transparent;
}
.dbg-btn:active{transform:scale(0.99);}
.dbg{
display:none;
margin-top:10px;
padding:10px 12px;
border-radius:12px;
border:1px dashed rgba(125,211,252,.6);
background:rgba(16,24,38,.6);
font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
color:#d8eaff;
font-size:12px;
line-height:1.35;
white-space:pre-wrap;
word-break:break-word;
}
.dbg.show{display:block;}
</style>
</head>
<body>
 <div class="wrap">
 <div class="top">
 <div class="title">
 <div class="title-row"><h1>DL&W Station</h1></div>
 <div class="subtitle"><span id="serviceBadge" class="badge">—</span><span>Next 3 scheduled departures • Northbound only</span></div>
 <div id="dbg" class="dbg"></div>

 </div>

05","exception_type":"1"},{"service_id":"5","date":"20260608","exception_type":"1"},{"service_id":"5","date":"20260609","exception_type":"1"},{"service_id":"5","date":"20260610","exception_type":"1"},{"service_id":"5","date":"20260611","exception_type":"1"},{"service_id":"5","date":"20260612","exception_type":"1"},{"service_id":"5","date":"20260615","exception_type":"1"},{"service_id":"5","date":"20260616","exception_type":"1"},{"service_id":"5","date":"20260617","exception_type":"1"},{"service_id":"5","date":"20260618","exception_type":"1"},{"service_id":"5","date":"20260619","exception_type":"1"}];
const SCHEDULE_BY_SERVICE = {"1":["06:47:00","07:07:00","07:27:00","07:47:00","08:07:00","08:27:00","08:47:00","09:07:00","09:27:00","09:47:00","10:07:00","10:27:00","10:47:00","11:07:00","11:27:00","11:47:00","12:07:00","12:27:00","12:47:00","13:07:00","13:27:00","13:47:00","14:07:00","14:27:00","14:47:00","15:07:00","15:27:00","15:47:00","16:07:00","16:27:00","16:47:00","17:07:00","17:27:00","17:47:00","18:07:00","18:27:00","18:47:00","19:07:00","19:27:00","19:47:00","20:07:00","20:27:00","20:47:00","21:07:00","21:27:00","21:47:00","22:07:00","22:27:00","22:47:00","23:07:00","23:27:00","23:47:00"],"2":["06:47:00","07:07:00","07:27:00","07:47:00","08:07:00","08:27:00","08:47:00","09:07:00","09:27:00","09:47:00","10:07:00","10:27:00","10:47:00","11:07:00","11:27:00","11:47:00","12:07:00","12:27:00","12:47:00","13:07:00","13:27:00","13:47:00","14:07:00","14:27:00","14:47:00","15:07:00","15:27:00","15:47:00","16:07:00","16:27:00","16:47:00","17:07:00","17:27:00","17:47:00","18:07:00","18:27:00","18:47:00","19:07:00","19:27:00","19:47:00","20:07:00","20:27:00","20:47:00","21:07:00","21:27:00","21:47:00","22:07:00","22:27:00","22:47:00","23:07:00","23:27:00","23:47:00"],"3":["07:47:00","08:07:00","08:27:00","08:47:00","09:07:00","09:27:00","09:47:00","10:07:00","10:27:00","10:47:00","11:07:00","11:27:00","11:47:00","12:07:00","12:27:00","12:47:00","13:07:00","13:27:00","13:47:00","14:07:00","14:27:00","14:47:00","15:07:00","15:27:00","15:47:00","16:07:00","16:27:00","16:47:00","17:07:00","17:27:00","17:47:00","18:07:00","18:27:00","18:47:00","19:07:00","19:27:00","19:47:00","20:07:00","20:27:00","20:47:00","21:07:00","21:27:00","21:47:00","22:07:00","22:27:00","22:47:00"],"4":["05:09:00","05:29:00","05:49:00","06:09:00","06:29:00","06:49:00","07:09:00","07:29:00","07:49:00","08:09:00","08:29:00","08:49:00","09:09:00","09:29:00","09:48:00","10:08:00","10:28:00","10:48:00","11:08:00","11:28:00","11:48:00","12:08:00","12:28:00","12:48:00","13:08:00","13:28:00","13:48:00","14:08:00","14:28:00","14:48:00","15:08:00","15:28:00","15:48:00","16:08:00","16:28:00","16:48:00","17:08:00","17:28:00","17:48:00","18:08:00","18:28:00","18:48:00","19:08:00","19:28:00","19:48:00","20:08:00","20:28:00","20:48:00","21:08:00","21:28:00","21:48:00","22:08:00","22:28:00","22:48:00","23:08:00","23:28:00","23:48:00","24:08:00"],"5":["05:09:00","05:29:00","05:49:00","06:09:00","06:29:00","06:49:00","07:09:00","07:29:00","07:49:00","08:09:00","08:29:00","08:49:00","09:09:00","09:29:00","09:48:00","10:08:00","10:28:00","10:48:00","11:08:00","11:28:00","11:48:00","12:08:00","12:28:00","12:48:00","13:08:00","13:28:00","13:48:00","14:08:00","14:28:00","14:48:00","15:08:00","15:28:00","15:48:00","16:08:00","16:28:00","16:48:00","17:08:00","17:28:00","17:48:00","18:08:00","18:28:00","18:48:00","19:08:00","19:28:00","19:48:00","20:08:00","20:28:00","20:48:00","21:08:00","21:28:00","21:48:00","22:08:00","22:28:00","22:48:00","23:08:00","23:28:00","23:48:00","24:08:00"]};
function parts(d){
 const fmt = new Intl.DateTimeFormat('en-US', {timeZone:TZ, year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false, weekday:'long'});
 const o={}; for (const p of fmt.formatToParts(d)) o[p.type]=p.value;
 return o;
}
function ymd(d){ const p=parts(d); return p.year+p.month+p.day; }
function localSeconds(d){ const p=parts(d); let h=Number(p.hour); if (h===24) h=0; return h*3600+Number(p.minute)*60+Number(p.second); }
function localDateLabel(d){ const p=parts(d); return `${p.weekday}, ${p.month}/${p.day}/${p.year}`; }
function localTimeLabel(d){ return new Intl.DateTimeFormat('en-US',{timeZone:TZ,hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(d); }
function activeServiceId(dateObj){
 const key=ymd(dateObj);
 const rows=CALENDAR_DATES.filter(r => String(r.date)===key && String(r.exception_type)==='1');
 return rows.length ? String(rows[0].service_id) : null;
}
function fmtTime(gtfsTime){
 let [h,m] = gtfsTime.split(':').map(Number);
 const suffix = (h % 24) >= 12 ? 'PM' : 'AM';
 let hh = h % 24; hh = hh % 12; if (hh===0) hh=12;
 return `${hh}:${String(m).padStart(2,'0')} ${suffix}`;
}
function gtfsSeconds(t){ const [h,m,s]=t.split(':').map(Number); return h*3600+m*60+(s||0); }
function departsIn(sec){
 if (sec <= 0) return 'Now';
 const m = Math.ceil(sec/60);
 if (m < 60) return `${m} min`;
 const h = Math.floor(m/60), mm = m % 60;
 return mm ? `${h} hr ${mm} min` : `${h} hr`;
}
function upcoming(now){
 const sid=activeServiceId(now);
 const list=sid && SCHEDULE_BY_SERVICE[sid] ? SCHEDULE_BY_SERVICE[sid] : [];
 const nowSec=localSeconds(now);
 let out=list.map(t=>({t, delta:gtfsSeconds(t)-nowSec})).filter(x=>x.delta>=-30);
 if (out.length<3) {
   const tomorrow=new Date(now.getTime()+86400000);
   const sid2=activeServiceId(tomorrow);
   const list2=sid2 && SCHEDULE_BY_SERVICE[sid2] ? SCHEDULE_BY_SERVICE[sid2] : [];
   out = out.concat(list2.map(t=>({t, delta:gtfsSeconds(t)+86400-nowSec})));
 }
 return {sid, rows:out.slice(0,3), count:list.length};
}
function renderSchedule(){
 const now=new Date();
 const data=upcoming(now);

 badge.textContent = ['Saturday','Sunday'].includes(p.weekday) ? 'WEEKEND' : 'WEEKDAY';
 badge.classList.toggle('weekend', ['Saturday','Sunday'].includes(p.weekday));
 tbody.innerHTML='';
 if (!data.sid || !data.rows.length) {
   pill.textContent='No scheduled service';
   tbody.innerHTML='<tr><td class="time">--</td><td class="dir">University</td><td class="in">--</td></tr>';
 } else {

   for (const r of data.rows) {
     const tr=document.createElement('tr');
     tr.innerHTML=`<td class="time">${fmtTime(r.t)}</td><td class="dir">University</td><td class="in">${departsIn(r.delta)}</td>`;
     tbody.appendChild(tr);
   }
 }
 document.getElementById('dbg').textContent = `Station: ${STATION_NAME}
Stop IDs: ${Array.from(STATION_STOP_IDS).join(', ')}
Active service_id: ${data.sid || 'none'}
Trips today: ${data.count}
Loaded from uploaded GTFS static feed.`;
}
function renderClock(){

 document.getElementById('clockTime').textContent=localTimeLabel(now);
 document.getElementById('clockDate').textContent=localDateLabel(now);
}
document.getElementById('dbgBtn').addEventListener('click',()=>document.getElementById('dbg').classList.toggle('show'));
document.addEventListener('keydown',e=>{ if(e.key.toLowerCase()==='d') document.getElementById('dbg').classList.toggle('show'); });
renderClock(); renderSchedule();
setInterval(renderClock,1000);
