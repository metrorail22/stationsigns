const ONLY=null;

function now(){return new Date();}
function sec(t){let[a,b,c]=t.split(":").map(Number);return a*3600+b*60+(c||0);}
function fmt12(t){let[h,m]=t.split(":");h=Number(h)%24;let ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${m} ${ap}`;}
function ymd(d){return new Intl.DateTimeFormat("en-CA",{timeZone:TZ}).format(d).replace(/-/g,"");}
function serviceDay(){let d=now();let h=Number(new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"2-digit",hour12:false}).format(d));return ymd(h<3?new Date(d-86400000):d);}
function active(day){let s=new Set();for(let r of CAL){if(r.date!==day)continue;if(r.exception_type==="1")s.add(r.service_id);if(r.exception_type==="2")s.delete(r.service_id);}return s;}

function next(dir){
  let day=serviceDay();
  let a=active(day);
  let nowp=new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(now()).split(":").map(Number);
  let nowSec=nowp[0]*3600+nowp[1]*60+nowp[2];
  if(day!==ymd(now())) nowSec+=86400;
  let want=dir==="NB"?"1":"0";
  return DEPS.filter(d=>STOPS.has(d.stop_id)&&TRIPS[d.trip_id]&&a.has(TRIPS[d.trip_id].service_id)
      &&String(TRIPS[d.trip_id].direction_id)===want&&sec(d.departure_time)>=nowSec)
    .sort((x,y)=>sec(x.departure_time)-sec(y.departure_time))
    .slice(0,2).map(d=>fmt12(d.departure_time));
}

function render(){
  let nb=ONLY==="SB"?[]:next("NB");
  let sb=ONLY==="NB"?[]:next("SB");
  document.getElementById("nb").textContent=nb.length?nb.join("  "):"--:-- --:--";
  document.getElementById("sb").textContent=sb.length?sb.join("  "):"--:-- --:--";
}

setInterval(()=>document.getElementById("clock").textContent=
  new Intl.DateTimeFormat("en-US",{timeZone:TZ,hour:"2-digit",minute:"2-digit",second:"2-digit"}).format(now()),1000);

render(); setInterval(render,10000);
</script>
